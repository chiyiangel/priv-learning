name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Node algorithm tests only. The Playwright browser check
      # (tests/browser_check.py) is local and is not run in CI.
      - run: npm test
